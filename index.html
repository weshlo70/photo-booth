<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📸 即時線上拍貼機</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 20px; }
    .main-container { max-width: 400px; margin: 0 auto; }
    
    .stage { position: relative; width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
    video, .frame-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    video { transform: scaleX(-1); } /* 鏡像自拍 */
    .frame-overlay { pointer-events: none; z-index: 2; }

    .btn { display: block; width: 100%; padding: 14px; font-size: 18px; font-weight: bold; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 15px; }
    .btn-start { background: #ff9800; }
    .btn-capture { background: #28a745; display: none; }
    .btn-download { background: #007bff; display: none; text-decoration: none; text-align: center; line-height: 20px; margin-top: 10px; }
    #hiddenCanvas { display: none; }
  </style>
</head>
<body>

  <div class="main-container">
    <h2>📸 即時預覽拍貼機</h2>

    <div class="stage">
      <video id="webcam" autoplay playsinline muted></video>
      <img id="frameOverlay" class="frame-overlay" src="https://lh3.googleusercontent.com/d/1Cp6flF9gkNnyOliXlOB3tGkOp4ybpmNE" alt="相框">
    </div>

    <button id="startBtn" class="btn btn-start" onclick="initCamera()">📷 開啟即時相機</button>
    <button id="captureBtn" class="btn btn-capture" onclick="takeSnapshot()">⚡ 按下拍照</button>
    <a id="downloadBtn" class="btn btn-download" download="my-photo.png">✨ 下載剛拍好的照片</a>
  </div>

  <canvas id="hiddenCanvas"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const frameOverlay = document.getElementById('frameOverlay');
    const hiddenCanvas = document.getElementById('hiddenCanvas');
    const startBtn = document.getElementById('startBtn');
    const captureBtn = document.getElementById('captureBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 960 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        startBtn.style.display = 'none';
        captureBtn.style.display = 'block';
      } catch (err) {
        alert("無法啟動相機：" + err.message);
      }
    }

    function takeSnapshot() {
      const w = video.videoWidth || 640;
      const h = video.videoHeight || 480;
      
      hiddenCanvas.width = w;
      hiddenCanvas.height = h;
      const ctx = hiddenCanvas.getContext('2d');

      // 畫自拍照（鏡像）
      ctx.translate(w, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, w, h);
      ctx.setTransform(1, 0, 0, 1, 0, 0);

      // 疊加外框
      if (frameOverlay.src && frameOverlay.complete) {
        ctx.drawImage(frameOverlay, 0, 0, w, h);
      }

      // 產生下載
      downloadBtn.href = hiddenCanvas.toDataURL('image/png');
      downloadBtn.style.display = 'block';
    }
  </script>
</body>
</html>
