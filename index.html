<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>📸 即時線上拍貼機</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      text-align: center;

      background: #121212;

      color: #fff;

      margin: 0;

      padding: 15px;

    }


    /* =====================================
       主要內容
       ===================================== */

    .main-container {

      width: 100%;

      max-width: 500px;

      margin: 0 auto;

    }


    /* =====================================
       標題
       ===================================== */

    h3 {

      margin-top: 0;

      margin-bottom: 12px;

    }


    /* =====================================
       16:9 相機區域
       ===================================== */

    .stage {

      position: relative;

      width: 100%;

      aspect-ratio: 16 / 9;

      background: #000;

      border-radius: 16px;

      overflow: hidden;

      box-shadow:
        0 8px 24px rgba(0,0,0,0.6);

    }


    /* =====================================
       相機
       ===================================== */

    video {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      object-fit: cover;

      transform: scaleX(-1);

      transition:
        filter 0.2s ease;

    }


    /* =====================================
       相框
       ===================================== */

    .frame-overlay {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      object-fit: cover;

      pointer-events: none;

      z-index: 2;

    }


    /* =====================================
       拍照完成照片
       ===================================== */

    #resultImg {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: none;

      z-index: 3;

    }


    /* =====================================
       濾鏡區
       ===================================== */

    .filter-title {

      margin-top: 15px;

      margin-bottom: 8px;

      font-size: 14px;

      font-weight: bold;

      color: #ccc;

    }


    .filter-container {

      display: flex;

      gap: 8px;

      overflow-x: auto;

      padding: 4px 2px 10px 2px;

      scrollbar-width: none;

      -webkit-overflow-scrolling: touch;

    }


    .filter-container::-webkit-scrollbar {

      display: none;

    }


    /* =====================================
       濾鏡按鈕
       ===================================== */

    .filter-btn {

      flex: 0 0 auto;

      min-width: 68px;

      padding: 9px 10px;

      border: 2px solid #444;

      border-radius: 12px;

      background: #242424;

      color: #fff;

      font-size: 12px;

      cursor: pointer;

      transition: all 0.2s ease;

      -webkit-tap-highlight-color: transparent;

    }


    .filter-btn:active {

      transform: scale(0.95);

    }


    .filter-btn.active {

      border-color: #ff9800;

      background: #ff9800;

      color: #fff;

      box-shadow:
        0 0 10px rgba(255,152,0,0.4);

    }


    /* =====================================
       按鈕
       ===================================== */

    .btn {

      display: block;

      width: 100%;

      padding: 13px;

      font-size: 16px;

      font-weight: bold;

      color: white;

      border: none;

      border-radius: 10px;

      cursor: pointer;

      margin-top: 12px;

      -webkit-tap-highlight-color: transparent;

    }


    .btn:active {

      transform: scale(0.98);

    }


    .btn-start {

      background: #ff9800;

    }


    .btn-capture {

      background: #28a745;

      display: none;

    }


    .btn-rephoto {

      background: #6c757d;

      display: none;

    }


    /* =====================================
       提示
       ===================================== */

    .tip-text {

      display: none;

      color: #4fc3f7;

      font-size: 14px;

      margin-top: 10px;

      font-weight: bold;

      line-height: 1.5;

    }


    /* =====================================
       Canvas
       ===================================== */

    #hiddenCanvas {

      display: none;

    }


    /* =====================================
       小手機
       ===================================== */

    @media (max-width: 360px) {

      body {

        padding: 10px;

      }


      .stage {

        border-radius: 12px;

      }


      .filter-btn {

        min-width: 62px;

        padding: 8px 8px;

        font-size: 11px;

      }


      .btn {

        padding: 12px;

        font-size: 15px;

      }

    }

  </style>

</head>


<body>


<div class="main-container">


  <h3>
    📸 即時線上拍貼機
  </h3>


  <!-- =====================================
       相機
       ===================================== -->

  <div class="stage">

    <video
      id="webcam"
      autoplay
      playsinline
      muted>
    </video>


    <!-- 相框 -->

    <img
      id="frameOverlay"
      class="frame-overlay"
      src="./frame.png"
      alt="相框">


    <!-- 拍照後照片 -->

    <img
      id="resultImg"
      alt="拍好的照片">

  </div>



  <!-- =====================================
       濾鏡
       ===================================== -->

  <div
    id="filterArea"
    style="display:none;">

    <div class="filter-title">
      🎨 選擇照片風格
    </div>


    <div class="filter-container">


      <button
        class="filter-btn active"
        data-filter="normal"
        onclick="selectFilter('normal', this)">

        📷<br>
        原圖

      </button>


      <button
        class="filter-btn"
        data-filter="beauty"
        onclick="selectFilter('beauty', this)">

        😊<br>
        美肌

      </button>


      <button
        class="filter-btn"
        data-filter="pink"
        onclick="selectFilter('pink', this)">

        🌸<br>
        粉嫩

      </button>


      <button
        class="filter-btn"
        data-filter="bright"
        onclick="selectFilter('bright', this)">

        ☀️<br>
        明亮

      </button>


      <button
        class="filter-btn"
        data-filter="vintage"
        onclick="selectFilter('vintage', this)">

        🎞️<br>
        復古

      </button>


      <button
        class="filter-btn"
        data-filter="bw"
        onclick="selectFilter('bw', this)">

        🖤<br>
        黑白

      </button>


      <button
        class="filter-btn"
        data-filter="warm"
        onclick="selectFilter('warm', this)">

        🌅<br>
        暖色

      </button>


      <button
        class="filter-btn"
        data-filter="cool"
        onclick="selectFilter('cool', this)">

        🧊<br>
        冷色

      </button>


      <button
        class="filter-btn"
        data-filter="dream"
        onclick="selectFilter('dream', this)">

        💜<br>
        夢幻

      </button>


    </div>

  </div>



  <!-- =====================================
       開啟相機
       ===================================== -->

  <button
    id="startBtn"
    class="btn btn-start"
    onclick="initCamera()">

    📷 開啟即時相機

  </button>



  <!-- =====================================
       拍照
       ===================================== -->

  <button
    id="captureBtn"
    class="btn btn-capture"
    onclick="takeSnapshot()">

    ⚡ 按下拍照

  </button>



  <!-- =====================================
       重拍
       ===================================== -->

  <button
    id="rephotoBtn"
    class="btn btn-rephoto"
    onclick="resetCamera()">

    🔄 重拍一張

  </button>



  <!-- =====================================
       提示
       ===================================== -->

  <p
    id="tipText"
    class="tip-text">

    💡 請長按上方照片<br>
    選擇「加入相片」儲存！

  </p>


</div>



<!-- Canvas -->

<canvas id="hiddenCanvas"></canvas>



<script>


/* ==========================================
   HTML 元件
   ========================================== */

const video =
  document.getElementById('webcam');


const frameOverlay =
  document.getElementById('frameOverlay');


const resultImg =
  document.getElementById('resultImg');


const hiddenCanvas =
  document.getElementById('hiddenCanvas');


const startBtn =
  document.getElementById('startBtn');


const captureBtn =
  document.getElementById('captureBtn');


const rephotoBtn =
  document.getElementById('rephotoBtn');


const tipText =
  document.getElementById('tipText');


const filterArea =
  document.getElementById('filterArea');



/* ==========================================
   目前使用的濾鏡
   ========================================== */

let currentFilter = 'normal';



/* ==========================================
   濾鏡 CSS
   ========================================== */

const filterCSS = {


  /* 原圖 */

  normal:
    'none',


  /* 美肌 */

  beauty:
    'brightness(1.08) contrast(0.92) saturate(1.05) blur(0.5px)',


  /* 粉嫩 */

  pink:
    'brightness(1.06) contrast(0.94) saturate(1.18) sepia(0.08) hue-rotate(-8deg)',


  /* 明亮 */

  bright:
    'brightness(1.18) contrast(0.95) saturate(1.08)',


  /* 復古 */

  vintage:
    'sepia(0.35) contrast(0.9) saturate(0.8) brightness(1.05)',


  /* 黑白 */

  bw:
    'grayscale(1) contrast(1.08)',


  /* 暖色 */

  warm:
    'sepia(0.18) saturate(1.2) brightness(1.04) hue-rotate(-5deg)',


  /* 冷色 */

  cool:
    'saturate(0.95) brightness(1.04) hue-rotate(15deg)',


  /* 夢幻 */

  dream:
    'brightness(1.1) contrast(0.88) saturate(1.15) blur(0.3px)'

};



/* ==========================================
   開啟相機
   ========================================== */

async function initCamera() {

  try {


    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          /*
           * 使用前鏡頭
           */

          facingMode: "user",


          /*
           * 優先要求 1280×720
           */

          width: {

            ideal: 1280

          },


          height: {

            ideal: 720

          }

        },


        audio: false

      });



    /*
     * 將相機放入 video
     */

    video.srcObject =
      stream;



    /*
     * 套用目前濾鏡
     */

    video.style.filter =
      filterCSS[currentFilter];



    /*
     * 相機載入完成
     */

    video.onloadedmetadata = () => {

      video.play();

    };



    /*
     * 隱藏開啟相機
     */

    startBtn.style.display =
      'none';



    /*
     * 顯示拍照
     */

    captureBtn.style.display =
      'block';



    /*
     * 顯示濾鏡
     */

    filterArea.style.display =
      'block';


  }

  catch (err) {


    alert(
      "無法啟動相機：" +
      err.message
    );


  }

}



/* ==========================================
   選擇濾鏡
   ========================================== */

function selectFilter(filterName, button) {


  /*
   * 記錄目前濾鏡
   */

  currentFilter =
    filterName;



  /*
   * 將濾鏡套到即時相機
   */

  video.style.filter =
    filterCSS[filterName];



  /*
   * 移除所有 active
   */

  document
    .querySelectorAll('.filter-btn')
    .forEach(btn => {

      btn.classList.remove('active');

    });



  /*
   * 選中的按鈕變成 active
   */

  button.classList.add('active');

}



/* ==========================================
   RGB 濾鏡處理
   ========================================== */

function applyCanvasFilter(
  ctx,
  width,
  height,
  filterName
) {


  /*
   * 先取得所有像素
   */

  const imageData =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );


  const data =
    imageData.data;



  /*
   * 美肌 / 其他效果
   *
   * Canvas 不支援所有 CSS filter
   * 所以這裡另外做色彩處理
   */

  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {


    let r = data[i];

    let g = data[i + 1];

    let b = data[i + 2];



    /* =========================
       美肌
       ========================= */

    if (
      filterName === 'beauty'
    ) {


      /*
       * 提亮
       */

      r *= 1.06;

      g *= 1.06;

      b *= 1.06;


      /*
       * 降低對比
       */

      r =
        128 +
        (r - 128) * 0.90;

      g =
        128 +
        (g - 128) * 0.90;

      b =
        128 +
        (b - 128) * 0.90;

    }



    /* =========================
       粉嫩
       ========================= */

    else if (
      filterName === 'pink'
    ) {


      r *= 1.08;

      g *= 1.02;

      b *= 1.05;

    }



    /* =========================
       明亮
       ========================= */

    else if (
      filterName === 'bright'
    ) {


      r *= 1.12;

      g *= 1.12;

      b *= 1.12;

    }



    /* =========================
       復古
       ========================= */

    else if (
      filterName === 'vintage'
    ) {


      const nr =
        r * 0.393 +
        g * 0.769 +
        b * 0.189;


      const ng =
        r * 0.349 +
        g * 0.686 +
        b * 0.168;


      const nb =
        r * 0.272 +
        g * 0.534 +
        b * 0.131;


      r = nr;

      g = ng;

      b = nb;

    }



    /* =========================
       黑白
       ========================= */

    else if (
      filterName === 'bw'
    ) {


      const gray =
        0.299 * r +
        0.587 * g +
        0.114 * b;


      r = gray;

      g = gray;

      b = gray;

    }



    /* =========================
       暖色
       ========================= */

    else if (
      filterName === 'warm'
    ) {


      r *= 1.08;

      g *= 1.02;

      b *= 0.94;

    }



    /* =========================
       冷色
       ========================= */

    else if (
      filterName === 'cool'
    ) {


      r *= 0.94;

      g *= 1.01;

      b *= 1.08;

    }



    /* =========================
       夢幻
       ========================= */

    else if (
      filterName === 'dream'
    ) {


      r *= 1.08;

      g *= 1.04;

      b *= 1.10;


      r =
        128 +
        (r - 128) * 0.90;

      g =
        128 +
        (g - 128) * 0.90;

      b =
        128 +
        (b - 128) * 0.90;

    }



    /*
     * 防止超過 255
     */

    data[i] =
      Math.min(255, Math.max(0, r));


    data[i + 1] =
      Math.min(255, Math.max(0, g));


    data[i + 2] =
      Math.min(255, Math.max(0, b));

  }



  /*
   * 將處理完的像素放回 Canvas
   */

  ctx.putImageData(
    imageData,
    0,
    0
  );

}



/* ==========================================
   拍照
   ========================================== */

function takeSnapshot() {


  /*
   * 確認相機已載入
   */

  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {


    alert(
      "相機畫面尚未載入，請稍候再試。"
    );


    return;

  }



  /*
   * 相機原始尺寸
   */

  const vW =
    video.videoWidth;


  const vH =
    video.videoHeight;



  /*
   * ======================================
   * 輸出 16:9
   * ======================================
   */

  let targetW =
    Math.round(
      vH * (16 / 9)
    );


  let targetH =
    vH;



  /*
   * 如果相機太窄
   */

  if (
    targetW > vW
  ) {


    targetW =
      vW;


    targetH =
      Math.round(
        targetW * (9 / 16)
      );

  }



  /*
   * 設定 Canvas
   */

  hiddenCanvas.width =
    targetW;


  hiddenCanvas.height =
    targetH;



  /*
   * Canvas context
   */

  const ctx =
    hiddenCanvas.getContext(
      '2d'
    );



  try {


    /*
     * ======================================
     * 計算裁切範圍
     * ======================================
     */

    const videoRatio =
      vW / vH;


    const targetRatio =
      targetW / targetH;


    let sWidth;

    let sHeight;

    let sx;

    let sy;



    /*
     * 相機比較寬
     */

    if (
      videoRatio > targetRatio
    ) {


      sHeight =
        vH;


      sWidth =
        vH * targetRatio;


      sx =
        (vW - sWidth) / 2;


      sy = 0;

    }


    /*
     * 相機比較高
     */

    else {


      sWidth =
        vW;


      sHeight =
        vW / targetRatio;


      sx = 0;


      sy =
        (vH - sHeight) / 2;

    }



    /*
     * ======================================
     * 鏡像
     * ======================================
     */

    ctx.save();


    ctx.translate(
      targetW,
      0
    );


    ctx.scale(
      -1,
      1
    );


    /*
     * 畫相機影像
     */

    ctx.drawImage(

      video,

      sx,
      sy,

      sWidth,
      sHeight,

      0,
      0,

      targetW,
      targetH

    );


    ctx.restore();



    /*
     * ======================================
     * 套用濾鏡
     * ======================================
     *
     * normal 不需要處理
     */

    if (
      currentFilter !== 'normal'
    ) {


      applyCanvasFilter(

        ctx,

        targetW,

        targetH,

        currentFilter

      );

    }



    /*
     * ======================================
     * 疊加相框
     * ======================================
     */

    if (
      frameOverlay.complete &&
      frameOverlay.naturalWidth !== 0
    ) {


      ctx.drawImage(

        frameOverlay,

        0,
        0,

        targetW,
        targetH

      );

    }



    /*
     * ======================================
     * 產生 PNG
     * ======================================
     */

    const imageUrl =
      hiddenCanvas.toDataURL(
        'image/png'
      );



    /*
     * 顯示拍好的照片
     */

    resultImg.src =
      imageUrl;


    resultImg.style.display =
      'block';



    /*
     * 隱藏相機
     *
     * 其實 resultImg z-index 會蓋住
     */

    captureBtn.style.display =
      'none';



    /*
     * 顯示重拍
     */

    rephotoBtn.style.display =
      'block';



    /*
     * 提示儲存
     */

    tipText.style.display =
      'block';


  }

  catch (e) {


    alert(
      "照片產生失敗：" +
      e.message
    );


  }

}



/* ==========================================
   重拍
   ========================================== */

function resetCamera() {


  /*
   * 隱藏照片
   */

  resultImg.style.display =
    'none';


  resultImg.src =
    '';



  /*
   * 顯示拍照
   */

  captureBtn.style.display =
    'block';



  /*
   * 隱藏重拍

   */

  rephotoBtn.style.display =
    'none';



  /*
   * 隱藏提示
   */

  tipText.style.display =
    'none';

}


</script>


</body>
</html>
