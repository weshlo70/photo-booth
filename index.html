<!DOCTYPE html>

<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>📸 即時線上拍貼機</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 15px;
    }

    /* =========================
       手機主要內容區
       ========================= */

    .main-container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    /* =========================
       1270 × 890 拍攝區域
       ========================= */

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1270 / 890;

      background: #000;

      border-radius: 16px;
      overflow: hidden;

      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.6);
    }

    /* =========================
       相機、相框、結果照片
       ========================= */

    video,
    .frame-overlay,
    #resultImg {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    /* 前鏡頭鏡像 */

    video {
      transform: scaleX(-1);
    }

    /* 相框永遠在最上面 */

    .frame-overlay {
      pointer-events: none;
      z-index: 2;
    }

    /* 拍照完成後的照片 */

    #resultImg {
      display: none;
      z-index: 3;
    }

    /* =========================
       倒數數字
       ========================= */

    #countdown {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      z-index: 10;

      display: none;

      font-size: 110px;
      font-weight: 900;

      line-height: 1;

      color: #fff;

      text-shadow:
        0 0 10px rgba(0, 0, 0, 0.9),
        0 0 25px rgba(0, 0, 0, 0.8),
        0 0 40px rgba(0, 0, 0, 0.7);

      pointer-events: none;

      animation: countdownPop 0.9s ease-out;
    }

    @keyframes countdownPop {

      0% {
        transform: translate(-50%, -50%) scale(1.5);
        opacity: 0;
      }

      30% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }

      80% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }

      100% {
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 0;
      }

    }

    /* =========================
       倒數選擇
       ========================= */

    .countdown-title {

      display: none;

      margin-top: 12px;
      margin-bottom: 6px;

      font-size: 14px;
      font-weight: bold;

      color: #ddd;

    }

    .countdown-options {

      display: none;

      width: 100%;

      gap: 10px;

      margin-top: 8px;

    }

    .countdown-option {

      flex: 1;

      padding: 11px;

      font-size: 16px;
      font-weight: bold;

      color: white;

      background: #333;

      border: 2px solid #555;

      border-radius: 10px;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

    }

    .countdown-option.active {

      background: #ff9800;

      border-color: #ff9800;

    }

    .countdown-option:active {

      transform: scale(0.98);

    }

    /* =========================
       按鈕
       ========================= */

    .btn {

      display: block;

      width: 100%;

      padding: 13px;

      font-size: 16px;
      font-weight: bold;

      color: white;

      border: none;
      border-radius: 10px;

      cursor: pointer;

      margin-top: 12px;

      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-start {
      background: #ff9800;
    }

    .btn-capture {
      background: #28a745;
      display: none;
    }

    .btn-capture:disabled {

      background: #555;

      cursor: not-allowed;

    }

    .btn-rephoto {
      background: #6c757d;
      display: none;
    }

    /* =========================
       提示文字
       ========================= */

    .tip-text {

      display: none;

      color: #4fc3f7;

      font-size: 14px;

      margin-top: 10px;

      font-weight: bold;

      line-height: 1.5;
    }

    /* =========================
       Canvas
       ========================= */

    #hiddenCanvas {
      display: none;
    }

    /* =========================
       小手機調整
       ========================= */

    @media (max-width: 360px) {

      body {
        padding: 10px;
      }

      .stage {
        border-radius: 12px;
      }

      .btn {
        padding: 12px;
        font-size: 15px;
      }

      #countdown {
        font-size: 90px;
      }

    }

  </style>

</head>

<body>

  <div class="main-container">

```
<h3 style="margin-top: 0; margin-bottom: 12px;">

  </div>

  <!-- =========================
       隱藏 Canvas
       ========================= -->

<canvas id="hiddenCanvas"></canvas>

  <script>


    /* =========================
       取得 HTML 元件
       ========================= */

    const video =
      document.getElementById('webcam');

    const frameOverlay =
      document.getElementById('frameOverlay');

    const resultImg =
      document.getElementById('resultImg');

    const hiddenCanvas =
      document.getElementById('hiddenCanvas');

    const startBtn =
      document.getElementById('startBtn');

    const captureBtn =
      document.getElementById('captureBtn');

    const rephotoBtn =
      document.getElementById('rephotoBtn');

    const tipText =
      document.getElementById('tipText');

    const countdown =
      document.getElementById('countdown');

    const countdownTitle =
      document.getElementById('countdownTitle');

    const countdownOptions =
      document.getElementById('countdownOptions');

    const countdown3 =
      document.getElementById('countdown3');

    const countdown5 =
      document.getElementById('countdown5');


    /* =========================
       預設倒數秒數
       ========================= */

    let selectedCountdown = 3;

    let isCountingDown = false;


    /* =========================
       開啟相機
       ========================= */

    async function initCamera() {

      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: {

              /*
               * 使用前鏡頭
               */

              facingMode: "user",

              /*
               * 優先要求 16:9
               */

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              }

            },

            audio: false

          });


        /*
         * 將相機串流放進 video
         */

        video.srcObject = stream;


        /*
         * 等待相機載入
         */

        video.onloadedmetadata = () => {

          video.play();

        };


        /*
         * 隱藏開啟相機按鈕
         */

        startBtn.style.display =
          'none';


        /*
         * 顯示倒數選擇
         */

        countdownTitle.style.display =
          'block';

        countdownOptions.style.display =
          'flex';


        /*
         * 顯示拍照按鈕
         */

        captureBtn.style.display =
          'block';


      } catch (err) {

        alert(
          "無法啟動相機：" +
          err.message
        );

      }

    }


    /* =========================
       選擇倒數秒數
       ========================= */

    function selectCountdown(seconds) {

      /*
       * 如果正在倒數
       * 不允許切換
       */

      if (isCountingDown) {
        return;
      }


      selectedCountdown =
        seconds;


      /*
       * 更新按鈕狀態
       */

      if (seconds === 3) {

        countdown3.classList.add(
          'active'
        );

        countdown5.classList.remove(
          'active'
        );

      } else {

        countdown5.classList.add(
          'active'
        );

        countdown3.classList.remove(
          'active'
        );

      }

    }


    /* =========================
       開始倒數
       ========================= */

    function startCountdown() {


      /*
       * 防止重複按下
       */

      if (isCountingDown) {
        return;
      }


      /*
       * 確認相機已經載入
       */

      if (
        !video.videoWidth ||
        !video.videoHeight
      ) {

        alert(
          "相機畫面尚未載入，請稍候再試。"
        );

        return;

      }


      isCountingDown =
        true;


      /*
       * 暫時禁止拍照按鈕
       */

      captureBtn.disabled =
        true;


      /*
       * 開始倒數
       */

      let number =
        selectedCountdown;


      showCountdownNumber(number);


      const timer =
        setInterval(() => {

          number--;


          if (number > 0) {

            showCountdownNumber(
              number
            );

          } else {

            clearInterval(timer);


            /*
             * 隱藏倒數
             */

            countdown.style.display =
              'none';


            /*
             * 恢復狀態
             */

            isCountingDown =
              false;


            captureBtn.disabled =
              false;


            /*
             * 真正拍照
             */

            takeSnapshot();

          }

        }, 1000);

    }


    /* =========================
       顯示倒數數字
       ========================= */

    function showCountdownNumber(number) {

      countdown.textContent =
        number;


      /*
       * 重新觸發動畫
       */

      countdown.style.animation =
        'none';


      void countdown.offsetWidth;


      countdown.style.animation =
        'countdownPop 0.9s ease-out';


      countdown.style.display =
        'block';

    }


    /* =========================
       拍照
       ========================= */

    function takeSnapshot() {


      /*
       * 確認相機已經載入
       */

      if (
        !video.videoWidth ||
        !video.videoHeight
      ) {

        alert(
          "相機畫面尚未載入，請稍候再試。"
        );

        return;

      }


      /*
       * 取得相機原始解析度
       */

      const vW =
        video.videoWidth;

      const vH =
        video.videoHeight;


      /*
       * =====================================
       * 強制輸出 1270 × 890
       * =====================================
       */

      const targetW = 1270;

      const targetH = 890;


      /*
       * 設定 Canvas 大小
       */

      hiddenCanvas.width =
        targetW;

      hiddenCanvas.height =
        targetH;


      /*
       * 取得 Canvas

       */

      const ctx =
        hiddenCanvas.getContext('2d');


      try {


        /*
         * =====================================
         * 計算 object-fit: cover
         * =====================================
         */

        const videoRatio =
          vW / vH;


        const targetRatio =
          targetW / targetH;


        let sWidth;

        let sHeight;

        let sx;

        let sy;


        /*
         * 原始相機畫面比較寬
         */

        if (
          videoRatio >
          targetRatio
        ) {

          sHeight =
            vH;

          sWidth =
            vH * targetRatio;


          /*
           * 左右裁切
           */

          sx =
            (vW - sWidth) / 2;

          sy =
            0;

        }


        /*
         * 原始相機畫面比較高
         */

        else {

          sWidth =
            vW;

          sHeight =
            vW / targetRatio;


          /*
           * 上下裁切
           */

          sx =
            0;

          sy =
            (vH - sHeight) / 2;

        }


        /*
         * =====================================
         * 鏡像自拍
         * =====================================
         */

        ctx.save();


        /*
         * 左右翻轉
         */

        ctx.translate(
          targetW,
          0
        );


        ctx.scale(
          -1,
          1
        );


        /*
         * 將相機畫面畫進 Canvas
         */

        ctx.drawImage(

          video,

          sx,
          sy,

          sWidth,
          sHeight,

          0,
          0,

          targetW,
          targetH

        );


        ctx.restore();


        /*
         * =====================================
         * 疊加 1270 × 890 相框
         * =====================================
         */

        if (
          frameOverlay.complete &&
          frameOverlay.naturalWidth !== 0
        ) {

          ctx.drawImage(

            frameOverlay,

            0,
            0,

            targetW,
            targetH

          );

        }


        /*
         * =====================================
         * 產生照片
         * =====================================
         */

        const imageUrl =
          hiddenCanvas.toDataURL(
            'image/png'
          );


        /*
         * 強制確認 Canvas 輸出尺寸
         */

        if (
          hiddenCanvas.width !== 1270 ||
          hiddenCanvas.height !== 890
        ) {

          alert(
            "輸出尺寸錯誤：" +
            hiddenCanvas.width +
            " × " +
            hiddenCanvas.height
          );

          return;

        }


        /*
         * 顯示照片
         */

        resultImg.src =
          imageUrl;

        resultImg.style.display =
          'block';


        /*
         * 隱藏拍照相關控制

         */

        captureBtn.style.display =
          'none';

        countdownTitle.style.display =
          'none';

        countdownOptions.style.display =
          'none';


        /*
         * 顯示重拍

         */

        rephotoBtn.style.display =
          'block';


        /*
         * 顯示提示

         */

        tipText.style.display =
          'block';


      } catch (e) {

        alert(
          "照片產生失敗：" +
          e.message
        );

      }

    }


    /* =========================
       重拍
       ========================= */

    function resetCamera() {


      /*
       * 隱藏結果照片
       */

      resultImg.style.display =
        'none';


      resultImg.src =
        '';


      /*
       * 顯示倒數選擇
       */

      countdownTitle.style.display =
        'block';

      countdownOptions.style.display =
        'flex';


      /*
       * 顯示拍照按鈕
       */

      captureBtn.style.display =
        'block';

      captureBtn.disabled =
        false;


      /*
       * 隱藏重拍
       */

      rephotoBtn.style.display =
        'none';


      /*
       * 隱藏提示
       */

      tipText.style.display =
        'none';


      /*
       * 確保倒數歸零

       */

      countdown.style.display =
        'none';


      isCountingDown =
        false;

    }

  </script>

</body>
</html>
