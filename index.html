<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📸 即時線上拍貼機</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 15px; }
    
    .main-container { max-width: 280px; margin: 0 auto; }
    
    .stage { position: relative; width: 100%; aspect-ratio: 9/16; background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
    video, .frame-overlay, #resultImg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    video { transform: scaleX(-1); }
    .frame-overlay { pointer-events: none; z-index: 2; }
    #resultImg { display: none; z-index: 3; }

    .btn { display: block; width: 100%; padding: 12px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 12px; }
    .btn-start { background: #ff9800; }
    .btn-capture { background: #28a745; display: none; }
    .btn-rephoto { background: #6c757d; display: none; }
    
    .tip-text { display: none; color: #4fc3f7; font-size: 14px; margin-top: 10px; font-weight: bold; line-height: 1.4; }
    #hiddenCanvas { display: none; }
  </style>
</head>
<body>

  <div class="main-container">
    <h3 style="margin-top: 0; margin-bottom: 12px;">📸 即時線上拍貼機</h3>

    <div class="stage">
      <video id="webcam" autoplay playsinline muted></video>
      <img id="frameOverlay" class="frame-overlay" src="./frame.png" alt="相框">
      <img id="resultImg" alt="拍好的照片">
    </div>

    <button id="startBtn" class="btn btn-start" onclick="initCamera()">📷 開啟即時相機</button>
    <button id="captureBtn" class="btn btn-capture" onclick="takeSnapshot()">⚡ 按下拍照</button>
    <button id="rephotoBtn" class="btn btn-rephoto" onclick="resetCamera()">🔄 重拍一張</button>
    
    <p id="tipText" class="tip-text">💡 請長按上方照片<br>選擇「加入相片」儲存！</p>
  </div>

  <canvas id="hiddenCanvas"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const frameOverlay = document.getElementById('frameOverlay');
    const resultImg = document.getElementById('resultImg');
    const hiddenCanvas = document.getElementById('hiddenCanvas');
    const startBtn = document.getElementById('startBtn');
    const captureBtn = document.getElementById('captureBtn');
    const rephotoBtn = document.getElementById('rephotoBtn');
    const tipText = document.getElementById('tipText');

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => { video.play(); };
        startBtn.style.display = 'none';
        captureBtn.style.display = 'block';
      } catch (err) {
        alert("無法啟動相機：" + err.message);
      }
    }

    function takeSnapshot() {
      if (!video.videoWidth || !video.videoHeight) {
        alert("相機畫面尚未載入，請稍候再試。");
        return;
      }

      const vW = video.videoWidth;
      const vH = video.videoHeight;
      
      // 強制將輸出畫布設定為直式 9:16 (例如 720x1280)
      const targetW = Math.min(vW, vH);
      const targetH = Math.round(targetW * (16 / 9));
      
      hiddenCanvas.width = targetW;
      hiddenCanvas.height = targetH;
      const ctx = hiddenCanvas.getContext('2d');

      try {
        // 1. 計算自拍影像維持比例填滿 (object-fit: cover) 的繪製區域
        const videoRatio = vW / vH;
        const targetRatio = targetW / targetH;
        let sWidth, sHeight, sx, sy;

        if (videoRatio > targetRatio) {
          sHeight = vH;
          sWidth = vH * targetRatio;
          sx = (vW - sWidth) / 2;
          sy = 0;
        } else {
          sWidth = vW;
          sHeight = vW / targetRatio;
          sx = 0;
          sy = (vH - sHeight) / 2;
        }

        // 2. 畫上鏡像自拍畫面
        ctx.save();
        ctx.translate(targetW, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, targetW, targetH);
        ctx.restore();

        // 3. 疊加 9:16 相框
        if (frameOverlay.complete && frameOverlay.naturalWidth !== 0) {
          ctx.drawImage(frameOverlay, 0, 0, targetW, targetH);
        }

        // 4. 輸出成直式照片
        const imageUrl = hiddenCanvas.toDataURL('image/png');
        resultImg.src = imageUrl;
        resultImg.style.display = 'block';

        captureBtn.style.display = 'none';
        rephotoBtn.style.display = 'block';
        tipText.style.display = 'block';

      } catch (e) {
        alert("照片產生失敗：" + e.message);
      }
    }

    function resetCamera() {
      resultImg.style.display = 'none';
      resultImg.src = '';
      captureBtn.style.display = 'block';
      rephotoBtn.style.display = 'none';
      tipText.style.display = 'none';
    }
  </script>
</body>
</html>
